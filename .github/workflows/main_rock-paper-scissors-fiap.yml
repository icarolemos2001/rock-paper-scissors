# Deploy da aplicação Pedra-Papel-Tesoura no Azure App Service

name: Build and deploy Java app to Azure Web App - rock-paper-scissors-fiap

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: target/roshambo.war

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Deploy WAR to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'rock-paper-scissors-fiap'
          slot-name: 'Production'
          package: './roshambo.war'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_07695542D5DC4475AE7881D3A5BCEF9D }}
